name: Release free plugin
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
env:
  PLUGIN_SLUG: madeit-vouchers
  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
  WCO_LABS_URL: ${{ vars.WCO_LABS_URL }}
  WCO_LABS_TOKEN: ${{ secrets.WCO_LABS_RELEASE_TOKEN }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -not -path './dist/*' -print0 | xargs -0 -n1 php -l
      - name: Run pure-logic tests
        run: |
          shopt -s nullglob
          for t in tests/*.php; do
            case "$t" in */smoke.php|*/checkout.php|*/classic-checkout.php|*/tax.php|*/mixed-cart.php) ;; *) php "$t" ;; esac;
          done
      - name: Verify tag, plugin header and readme stable tag agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^[[:space:]*]*Version:' "$PLUGIN_SLUG.php" | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | sed -E 's/.*Stable tag:[[:space:]]*//' | tr -d '[:space:]')
          if [ "$HEADER" != "$VERSION" ] || [ "$STABLE" != "$VERSION" ]; then
            echo "Tag $VERSION, Version header $HEADER and Stable tag $STABLE must be identical" >&2; exit 1
          fi
      - name: Build ZIP
        run: ./bin/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_SLUG }}-${{ github.ref_name }}
          path: dist/${{ env.PLUGIN_SLUG }}.zip
      # Lets visitors of the shop download the free plugin from the Downloads page, also before the plugin is approved on WordPress.org.
      - name: Extract the changelog of this version
        if: startsWith(github.ref, 'refs/tags/v') && env.WCO_LABS_TOKEN != ''
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 == "## " v {found=1; print; next} /^## / {found=0} found' CHANGELOG.md > dist/changelog.md
          test -s dist/changelog.md || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
      - name: Publish the release to the MadeIT Labs shop downloads
        if: startsWith(github.ref, 'refs/tags/v') && env.WCO_LABS_TOKEN != ''
        run: |
          curl --fail-with-body -sS -X POST "$WCO_LABS_URL/api/v1/admin/releases" \
            -H "Authorization: Bearer $WCO_LABS_TOKEN" -H "Accept: application/json" \
            -F "product=$PLUGIN_SLUG" -F "version=${GITHUB_REF_NAME#v}" \
            -F "changelog=<dist/changelog.md" -F "package=@dist/$PLUGIN_SLUG.zip" \
            -F "requires_wp=6.6" -F "requires_php=8.0"
      # Runs only after the plugin has been approved on WordPress.org and the SVN_USERNAME and SVN_PASSWORD secrets exist.
      - name: Deploy to WordPress.org
        if: startsWith(github.ref, 'refs/tags/v') && env.SVN_USERNAME != ''
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SLUG: ${{ env.PLUGIN_SLUG }}
          ASSETS_DIR: .wordpress-org
