services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: test-only
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: test-only
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost -uroot -ptest-only']
      interval: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql
  wp:
    image: wordpress:php8.2-apache
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: test-only
      WORDPRESS_DB_NAME: wordpress
    depends_on:
      db: {condition: service_healthy}
    ports:
      - '18080:80'
    networks: [default, web]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.wco-labs-demo.rule=Host(`wco-labs-demo.localhost`)
      - traefik.http.routers.wco-labs-demo.entrypoints=http
      - traefik.http.services.wco-labs-demo.loadbalancer.server.port=80
    volumes:
      - wp_data:/var/www/html
      - ../:/var/www/html/wp-content/plugins/wco-vouchers:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
  cli:
    image: wordpress:cli
    user: '33:33'
    command: sleep infinity
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: test-only
      WORDPRESS_DB_NAME: wordpress
    depends_on:
      db: {condition: service_healthy}
      wp: {condition: service_started}
    networks: [default, web]
    volumes:
      - wp_data:/var/www/html
      - ../:/var/www/html/wp-content/plugins/wco-vouchers:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
volumes:
  db_data:
  wp_data:

networks:
  web:
    external: true
